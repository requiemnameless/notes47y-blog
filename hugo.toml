baseURL = "https://notes47y.pages.dev/"
languageCode = "zh-TW"
title = "Notes47y - 知識管理與 AI 協作"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true

# 多語言支援
defaultContentLanguage = "zh-tw"
defaultContentLanguageInSubdir = false

# AEO 優化：自動生成 sitemap
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# AEO 優化：輸出格式（包含 RSS）
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

# AEO 優化：RSS 配置
[outputFormats.RSS]
  mediatype = "application/rss"
  baseName = "feed"

# Permalinks 結構
[permalinks]
  posts = "/:year/:month/:slug/"

# Markup 設定（支援 Obsidian 語法）
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    noClasses = false
    style = "monokai"

# PaperMod 主題參數
[params]
  env = "production"
  title = "Notes47y"
  description = "知識管理與 AI 協作的實踐筆記 - AI Collaboration, Knowledge Management, Productivity"
  keywords = ["AI協作", "知識管理", "Salesforce", "自動化", "生產力", "Obsidian", "卡片盒筆記法"]
  author = "Notes47y"

  # AEO 優化：結構化資料
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false

  # SEO/AEO 優化
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = true

  # 首頁資訊
  [params.homeInfoParams]
    Title = "歡迎來到 Notes47y 👋"
    Content = """
    知識管理與 AI 協作的實踐筆記

    探索 AI 協作開發、知識管理系統、自動化工作流程
    """

  # Social Links
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/requiemnameless"

  [[params.socialIcons]]
    name = "rss"
    url = "/feed.xml"

  # AEO 優化：Schema.org 結構化資料
  [params.schema]
    publisherType = "Person"
    publisherName = "Notes47y"
    publisherLogo = ""
    authorType = "Person"
    authorName = "Notes47y"
    sameAs = ["https://github.com/requiemnameless"]

  # AEO 優化：Analytics（可選）
  # [params.analytics.google]
  #   SiteVerificationTag = "XYZabc"

# 主選單
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "archive"
    name = "歸檔"
    url = "/archives/"
    weight = 20

  [[menu.main]]
    identifier = "tags"
    name = "標籤"
    url = "/tags/"
    weight = 30

  [[menu.main]]
    identifier = "search"
    name = "搜尋"
    url = "/search/"
    weight = 40

# AEO 優化：Open Graph / Twitter Cards
[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ["title", "permalink", "summary", "content"]
