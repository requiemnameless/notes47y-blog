baseURL = "https://blog.notes47y.win/"
languageCode = "zh-TW"
title = "Notes47y"
theme = "PaperMod"
[pagination]
  pagerSize = 10
enableRobotsTXT = true
buildDrafts = false

[params]
  env = "production"
  title = "Notes47y"
  mainSections = ["posts"]
  description = "AI 協作、知識管理與 Salesforce 技術的實踐筆記。分享真實工作流、踩坑心得與深度洞察。"
  keywords = ["AI 協作", "知識管理", "Zettelkasten", "Salesforce", "Claude Code", "Obsidian"]
  author = "Shawn Cheng"
  images = ["/images/og-default.png"]
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.profileMode]
    enabled = true
    title = "Notes47y"
    subtitle = "AI 協作 × 知識管理 × Salesforce｜用真實踩坑經驗取代教科書式說明"
    imageUrl = "/images/avatar.png"
    imageWidth = 120
    imageHeight = 120
    imageTitle = "Notes47y"

  [params.homeInfoParams]
    Title = "嗨，我是 Shawn 👋"
    Content = "分享 AI 協作、知識管理與 Salesforce 的實踐筆記。用真實踩坑經驗取代教科書式說明。"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/notes47y"

  [[params.socialIcons]]
    name = "threads"
    url = "https://threads.net/@notes47y"

  [[params.socialIcons]]
    name = "instagram"
    url = "https://instagram.com/notes47y"

  [[params.socialIcons]]
    name = "facebook"
    url = "https://facebook.com/profile.php?id=61570761473290"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [params.assets]
    favicon = "/favicon.svg"
    favicon16x16 = "/favicon.svg"
    favicon32x32 = "/favicon.svg"
    apple_touch_icon = "/favicon.svg"

  [params.label]
    text = "notes47y"
    icon = "/images/logo.png"
    iconHeight = 28

[taxonomies]
  category = "categories"
  tag = "tags"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "標籤"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "搜尋"
    url = "/search/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "關於"
    url = "/about/"
    weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = true
    style = "github-dark"
